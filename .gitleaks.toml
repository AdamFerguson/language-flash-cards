# Project gitleaks rules.
title = "language-flash-cards"

[extend]
useDefault = true

[allowlist]
description = """
Cloudflare Access values that are public by design:
- ACCESS_AUD: the policy AUD tag appears in every visitor's login redirect
  (https://<team>.cloudflareaccess.com/cdn-cgi/access/login/...?kid=<AUD>). It is an
  identifier/revocation handle, not a credential — Cloudflare's docs explicitly note
  AUD + JWK URL are not secrets.
- ACCESS_TEAM: the team name is literally the login-redirect hostname.
Allowlisted only on the ACCESS_* lines (no path rule — a path allowlist would
blanket the whole file; verified empirically that path conditions are OR'd).
"""
regexes = ['''"ACCESS_AUD"\\s*:\\s*"[0-9a-f]+"''', '''"ACCESS_TEAM"\\s*:\\s*"[a-z0-9-]+"''']
